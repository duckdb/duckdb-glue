#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      duckdb_version: 'd1ddea56f6e9fc82ff12181e7172ca52e3d9ee1e'
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      runners: ${{ needs.prepare.outputs.runners }}
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: d1ddea56f6e9fc82ff12181e7172ca52e3d9ee1e
      ci_tools_version: main
      extension_name: glue
      format_checks: 'format'
